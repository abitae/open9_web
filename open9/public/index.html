<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="OPEN9 — expertos en automatización e IA. Transformamos procesos manuales en soluciones inteligentes que impulsan tu negocio."
    />

    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>OPEN9 · Expertos en automatización</title>
    <script type="module" crossorigin src="/assets/index-BHPdvlM3.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DRe65gSa.css">
    <style>
      :root {
        --sg-blue: #0077FF;
        --sg-blue-dark: #0044AA;
        --sg-ink: #1A1A1A;
        --sg-line: #E5E5E5;
        --sg-paper: #FFFFFF;
        --sg-page: #FFFFFF;
        --open9-primary: #0077FF;
        --open9-primary-dark: #0044AA;
        --open9-accent: #0077FF;
        --open9-white: #1A1A1A;
        --open9-gray-light: #E5E5E5;
        --open9-gray-dark: #FFFFFF;
        --open9-black: #FFFFFF;
      }

      .store-shell { padding: 8.5rem 1.25rem 5rem; }
      .store-wrap { max-width: 80rem; margin: 0 auto; }
      .store-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1.25rem; margin-bottom: 1.75rem; }
      .store-kicker { font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; }
      .store-title { font-size: 2rem; font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; margin: 0.4rem 0 0; }
      .store-lead { max-width: 36rem; margin-top: 0.7rem; font-size: 0.925rem; line-height: 1.6; }
      .store-toolbar { display: grid; gap: 0.75rem; margin-bottom: 1rem; padding: 0.75rem; border-radius: 1.5rem; position: sticky; top: 6.5rem; z-index: 20; }
      .store-brands { display: flex; flex-wrap: wrap; align-items: center; gap: 0.55rem; margin: 0 0 1rem; }
      .store-brands-label { width: 100%; margin: 0; font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; }
      .store-brand {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.35rem 0.8rem 0.35rem 0.4rem;
        border-radius: 999px;
        border: 1px solid var(--sg-line);
        background: #fff;
        color: var(--sg-ink);
        cursor: pointer;
        font-size: 0.75rem;
      }
      .store-brand:has(> span:only-child),
      .store-brand:not(:has(img)) { padding-left: 0.8rem; }
      .store-brand-logo,
      .store-card-brand {
        width: 1.45rem;
        height: 1.45rem;
        object-fit: cover;
        border-radius: 999px;
        background: #f4f6fb;
      }
      .store-card-brand { width: 1.15rem; height: 1.15rem; }
      .store-brand-active {
        border-color: var(--sg-blue);
        background: #eef3ff;
        color: var(--sg-blue-dark);
      }
      .store-select { background: transparent; border: 0; outline: none; font-size: 0.8rem; max-width: 16rem; }
      .store-grid { display: grid; gap: 1.25rem; grid-template-columns: minmax(0, 1fr); }
      .store-card { min-height: 100%; }
      .store-media { position: relative; display: block; width: 100%; height: 13.5rem; overflow: hidden; padding: 0; border: 0; cursor: pointer; background: transparent; }
      .store-media img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
      .store-card:hover .store-media img { transform: scale(1.04); }
      .store-clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .store-stock-ok { color: #3DDC97; }
      .store-stock-low { color: #E8B931; }
      .store-stock-out { color: #F07167; }
      .store-overlay {
        position: fixed;
        inset: 0;
        z-index: 400;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
        background: rgba(13, 13, 13, 0.62);
        pointer-events: auto;
      }
      .store-panel,
      .store-panel button {
        pointer-events: auto;
        position: relative;
        z-index: 1;
      }
      .store-panel {
        display: flex;
        flex-direction: column;
        width: min(920px, 100%);
        max-height: min(85vh, 52rem);
        overflow: hidden;
        border-radius: 1.5rem;
      }
      .store-panel-main {
        display: grid;
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
      }
      .store-panel-media {
        position: relative;
        background: #0D0D0D;
        min-height: 12rem;
      }
      .store-panel-media img { width: 100%; height: 14rem; object-fit: cover; display: block; }
      .store-thumbs { display: flex; gap: 0.5rem; padding: 0.75rem; }
      .store-thumb { width: 3.25rem; height: 3.25rem; padding: 0; border: 1px solid transparent; border-radius: 0.75rem; overflow: hidden; cursor: pointer; background: transparent; }
      .store-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .store-thumb-active { border-color: var(--sg-blue); }
      .store-panel-body { padding: 1.25rem 1.5rem 1.5rem; min-width: 0; }
      .store-related {
        flex: 0 0 auto;
        padding: 0.85rem 1.25rem 1rem;
        border-top: 1px solid rgba(26, 26, 26, 0.08);
        background: rgba(255, 255, 255, 0.72);
      }
      .store-related-grid {
        display: flex;
        gap: 0.6rem;
        overflow-x: auto;
        margin-top: 0.65rem;
      }
      .store-related-card {
        display: flex;
        flex: 1 1 0;
        min-width: 9.5rem;
        gap: 0.65rem;
        align-items: center;
        text-align: left;
        padding: 0.4rem;
        border: 0;
        border-radius: 0.9rem;
        background: transparent;
        cursor: pointer;
      }
      .store-related-card img {
        width: 2.75rem;
        height: 2.75rem;
        object-fit: cover;
        border-radius: 0.65rem;
        flex-shrink: 0;
      }
      .store-related-copy {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }
      .store-related-copy strong {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-size: 0.75rem;
        font-weight: 500;
        font-style: normal;
        line-height: 1.25;
      }
      .store-related-copy em {
        font-size: 0.6875rem;
        font-style: normal;
      }
      .store-toast { position: fixed; right: 1rem; bottom: 1.25rem; z-index: 70; padding: 0.85rem 1.1rem; border-radius: 1rem; max-width: 18rem; }
      .store-card button:disabled { opacity: 0.4; cursor: not-allowed; }
      @media (min-width: 640px) {
        .store-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (min-width: 768px) {
        .store-title { font-size: 2.55rem; }
        .store-toolbar { grid-template-columns: 1fr auto; align-items: center; }
        .store-overlay { padding: 1.5rem; }
        .store-panel { border-radius: 2rem; }
        .store-panel-main { grid-template-columns: 1.05fr 1fr; }
        .store-panel-media img {
          position: absolute;
          inset: 0;
          height: 100%;
        }
        .store-thumbs {
          position: absolute;
          right: 0;
          bottom: 0;
          left: 0;
          z-index: 1;
          background: rgba(13, 13, 13, 0.45);
        }
      }
      @media (min-width: 1100px) {
        .store-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }
      @media (min-width: 1024px) {
        .store-shell { padding-top: 9rem; padding-left: 1.5rem; padding-right: 1.5rem; }
        .store-toolbar { top: 6.75rem; }
        .store-cart-bar { display: none !important; }
      }

      .page-hero-visual,
      .page-hero-card .hero-orb { display: none !important; }
      .page-hero-card {
        padding: 1.35rem 1.4rem !important;
      }
      .page-hero-content h1,
      .page-hero-shell h1 {
        font-size: clamp(1.7rem, 3vw, 2.4rem) !important;
        line-height: 1.15 !important;
        margin-top: 0.55rem !important;
      }
      .page-hero-content p {
        margin-top: 0.65rem !important;
      }
      @media (min-width: 1024px) {
        .page-hero-card { padding: 1.55rem 2rem !important; }
      }

      .softgen-hero {
        padding-bottom: 2.25rem !important;
      }
      .softgen-hero h1 {
        font-size: clamp(2rem, 4.2vw, 3.05rem) !important;
        line-height: 1.12 !important;
      }
      .softgen-hero-art img,
      .softgen-hero-art video {
        max-height: 26rem;
        width: 100%;
        object-fit: cover;
      }

      nav.liquid-glass-strong {
        overflow: visible !important;
      }
      a[href*="carrito"],
      a[aria-label^="Carrito"] {
        overflow: visible !important;
        clip-path: none !important;
      }
      a[href*="carrito"] > span.bg-tech-accent,
      a[aria-label^="Carrito"] > span.bg-tech-accent {
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        top: -0.2rem !important;
        right: -0.2rem !important;
        min-width: 1.25rem !important;
        width: auto !important;
        height: 1.25rem !important;
        padding: 0 0.28rem !important;
        font-size: 11px !important;
        line-height: 1 !important;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: visible !important;
        box-sizing: border-box;
        color: #fff !important;
        background: #0077FF !important;
        border: 2px solid #fff;
        box-shadow: 0 1px 4px rgba(0, 68, 170, 0.28);
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
